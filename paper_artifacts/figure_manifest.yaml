# Figure provenance manifest
#
# Single source of truth for the figures of the consolidated manuscript
# (docs/paper_combined): 12 main figures (Figure 1-12) and 31 supplementary figures
# (S1-S31). Each entry gives the output file stem (`file`), the generator `script`, and
# the versioned source artefacts it reads. No numerical values are entered by hand into
# the plotting scripts except display labels, axis limits, and pre-specified thresholds
# (comfort band 21-24 deg C, m_s = 1, the 1.25x-PI transfer threshold). Schematics carry
# no data source; their annotated numbers are reproduced from the CSVs of the data figures.
#
# Display naming: the manuscript uses BB (black-box surrogate, formerly v3),
# matched-resolution BB (formerly matched-v3), and GB (grey-box RC-NeuralODE, formerly
# v3.5). evaluation/_figstyle.py is the single source of these labels. A few legacy
# supplementary schematics still print v3/v3.5 internally; the Supplementary front matter
# carries an explicit legacy-label note (v3 = BB, v3.5 = GB).
#
# Regenerate every figure AND refresh docs/paper_combined/figures/ (no BOPTEST, no GPU):
#   python make_figures.py            # ~1-2 min  (or ./make_all_figures.sh)
#   python make_figures.py --list     # show the ordered generator list

main_figures:
  Figure_1:
    title: System / method overview (backends -> controller families -> live BOPTEST)
    label: fig:system_overview
    file: block2_system_overview
    script: evaluation/build_system_overview.py
    kind: schematic

  Figure_2:
    title: BOPTEST testcase schematics (source bestest_air + three hydronic targets)
    label: fig:testcases
    file: testcase_schematics
    script: evaluation/build_testcase_schematics.py
    kind: schematic
    audit_note: "Topology and component ratings from the official BOPTEST documentation (Blum et al., 2021)."

  Figure_3:
    title: Hybrid reward-shaping mechanism (BB rollout + frozen GB censor)
    label: fig:hybrid_mechanism
    file: final17_fig07_hybrid_reward_shaping_mechanism
    script: evaluation/build_final_q1_main_figures_17.py
    source_files:
      - outputs/block2_thermostatic_hybrid_v3_v35_l010/summary.csv

  Figure_4:
    title: Stage A/B/C calibration diagnostics (C_zon convergence, rollout error, residuals)
    label: fig:stage-abc
    file: rie_fig03_stage_abc_diagnostics
    script: evaluation/build_block1_main_bbgb.py
    source_files:
      - outputs/surrogate_v35_inverse_boptest_15min_episodeaware/stage_b_history_v35.csv
      - outputs/surrogate_v3_rollout_prepared_15min/
      - reports/block1_corpus_matched_comparison.csv

  Figure_5:
    title: Multi-horizon predictive validity (rollout RMSE + tolerance CDF)
    label: fig:predictive-validity
    file: rie_fig04_predictive_validity
    script: evaluation/build_block1_main_bbgb.py
    source_files:
      - outputs/surrogate_v3_rollout_prepared_15min/

  Figure_6:
    title: Matched-corpus predictive-fidelity attribution (waterfall)
    label: fig:matched
    file: rie_fig05_matched_corpus_attribution
    script: evaluation/build_block1_main_bbgb.py
    source_files:
      - reports/block1_corpus_matched_comparison.csv
    audit_note: "Additive split: corpus shift (74.6%) + Stage A/B/C calibration (25.4%) of the 0.913 deg C BB-hourly -> calibrated-GB gap."

  Figure_7:
    title: Fidelity-utility scatter (24 h rollout RMSE vs live m_s)
    label: fig:paradox_scatter
    file: block2_fidelity_utility_scatter
    script: evaluation/build_fidelity_utility_scatter.py
    source_files:
      - reports/block1_corpus_matched_comparison.csv
      - reports/hou_evins_architecture_justification_table.csv
      - reports/block2_v3_15min_closed_loop_comparison.csv
      - outputs/block2_thermostatic_hybrid_v3_v35_l010/summary.csv
    generated_table: reports/block2_fidelity_utility_scatter.csv
    thresholds: ["m_s = 1 (collapse)", "m_s < 0.1 (usable band)"]

  Figure_8:
    title: Live BOPTEST maintenance-score decomposition (r_time + r_sev per controller)
    label: fig:ms_decomp
    file: fig_block2_ms_decomposition
    script: evaluation/build_block1_main_bbgb.py
    source_files:
      - "outputs/block2_*/summary.csv"

  Figure_9:
    title: Response-surface roughness mechanism (4 panels)
    label: fig:roughness_mechanism
    file: block2_surface_response_curves
    script: evaluation/build_mechanism_surface_diagnostic.py
    source_files:
      - outputs/surrogate_v2/rc_node_v3_tsupply.pt
      - outputs/surrogate_v3_15min_matched/rc_node_v3_15min_matched.pt
      - outputs/surrogate_v35_inverse_boptest_15min_power_head_only/calibration_summary_boptest_v35.json
      - outputs/bestest_air_article7_style_15min/traces/peak_heat_window_thermostatic.csv
      - outputs/block2_bestest_air_15min_thermostatic_v35/traces/peak_heat_window_thermostatic.csv
    generated_table: reports/block2_mechanism_surface_sharpness.csv
    audit_note: "Panel D live m_s read via reports/block2_fidelity_utility_scatter.csv; causal wording is association-only."

  Figure_10:
    title: Comfort-energy deployment plane (comfort/safety margin vs energy)
    label: fig:deployment_plane
    file: block3_q1_polish_deployment_quadrants
    script: evaluation/build_q1_polish_block2_block3_figures.py
    source_files:
      - reports/block3_transfer_matrix.csv
    thresholds: ["M_k = tau_k - m_s_RL = 0 (pass boundary, tau_k = 1.25 m_s_PI)", "energy delta = 0%"]

  Figure_11:
    title: Surrogate-side transfer RMSE improvement across the hydronic family
    label: fig:surrogate_physics_transfer_a
    file: final17_fig15_full_stage_transfer_rmse_improvement
    script: evaluation/build_final_q1_main_figures_17.py
    source_files:
      - reports/block3_transfer_matrix.csv

  Figure_12:
    title: Re-identified C_zon hypothesis interval (uniform vs scale-dependent)
    label: fig:surrogate_physics_transfer_b
    file: final_eng_fig12_czon_hypothesis_interval
    script: evaluation/build_final_q1_main_figures_17.py
    source_files:
      - reports/block3_transfer_matrix.csv

graphical_abstract:
  title: Four-column causal chain (backend -> surface -> PPO -> live outcome)
  file: graphical_abstract
  script: evaluation/build_graphical_abstract.py
  source_files:
    - reports/block2_mechanism_surface_sharpness.csv
    - reports/block2_fidelity_utility_scatter.csv
  audit_note: "RMSE values and the ~85x throughput figure are canonical results cited in the paper; all other numbers are read from the source files above."

